# Remote LUKS unlock over SSH in the initramfs (omashiri-remote-unlock).
# Authorized keys: /etc/dropbear/root_key (authorized_keys format, one key
# per line). Rebuild afterwards with: mkinitcpio -P
# Drop-ins replace HOOKS wholesale; edit this list if your base hooks differ.
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block netconf dropbear encryptssh filesystems fsck)
