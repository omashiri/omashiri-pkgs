name: Publish to GitHub release

on:
  push:
    branches: [main]
    paths: [pkgbuilds/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency: publish-release

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm git github-cli sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - uses: actions/checkout@v4
      - name: Build packages
        run: |
          chown -R builder: .
          mkdir -p /tmp/repo
          for dir in pkgbuilds/*/; do
            grep -qE "^arch=.*(x86_64|any)" "$dir/PKGBUILD" || continue
            (cd "$dir" && sudo -u builder env PKGDEST=/tmp/repo makepkg -sfc --noconfirm --skippgpcheck)
          done
      - name: Sign and index
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          cd /tmp/repo
          sign=()
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
            key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
            for f in *.pkg.tar.*; do gpg --batch --detach-sign --use-agent -u "$key" "$f"; done
            sign=(--sign --key "$key")
          fi
          repo-add "${sign[@]}" omashiri.db.tar.zst *.pkg.tar.zst
          cp -L omashiri.db.tar.zst omashiri.db
          cp -L omashiri.files.tar.zst omashiri.files
      - name: Replace edge release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release delete edge --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create edge --prerelease -t edge -n "Rolling package repo" /tmp/repo/* -R "$GITHUB_REPOSITORY"
