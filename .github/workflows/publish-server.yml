name: Publish to pkg.omashiri.com

on:
  push:
    branches: [main]
    paths: [pkgbuilds/**, scripts/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency: publish-server

jobs:
  build-publish:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Prepare builder
        run: |
          pacman -Syu --noconfirm base-devel git openssh rsync nodejs gnupg
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Build packages
        run: |
          mkdir -p /out && chown builder /out
          chown -R builder .
          for d in pkgbuilds/*/; do
            grep -qE '^arch=.*(x86_64|any)' "$d/PKGBUILD" || continue
            deps=-s; grep -q '^makedepends' "$d/PKGBUILD" || deps=-d
            (cd "$d" && sudo -u builder env PKGDEST=/out makepkg $deps --noconfirm --clean --skippgpcheck)
          done

      - name: Publish
        env:
          SERVER: ${{ secrets.REMOTE }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$GPG_SIGNING_KEY" | gpg --batch --import
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$SERVER" >> ~/.ssh/known_hosts
          export REMOTE="pkgdeploy@$SERVER:/srv/omashiri-repo/omashiri/os/x86_64"
          scripts/publish.sh /out
