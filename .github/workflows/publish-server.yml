name: Publish to pkg.omashiri.com

on:
  push:
    branches: [main]
    paths: [pkgbuilds/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency: publish-server

jobs:
  publish:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Build packages
        run: |
          out=$(mktemp -d)
          echo "OUT=$out" >> "$GITHUB_ENV"
          for dir in pkgbuilds/*/; do
            grep -qE "^arch=.*(x86_64|any)" "$dir/PKGBUILD" || continue
            (cd "$dir" && PKGDEST="$out" makepkg -sfc --noconfirm --skippgpcheck)
          done
      - name: Sign and publish
        env:
          REMOTE: ${{ vars.PKG_REMOTE }}
          GPG_KEY_ID: ${{ vars.GPG_KEY_ID }}
        run: scripts/publish.sh "$OUT"
